[project]
name = "scholarverify-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "python-multipart==0.0.9",
    "rapidocr-onnxruntime==1.4.0",
    "opencv-python-headless>=4.5.1.48",
    "pillow==11.0.0",
    "pypdf==5.1.0",
]

[tool.uv]
package = false
# rapidocr pulls in opencv-python, which needs libGL (not available on Vercel).
# Swap it for the headless build that provides the same cv2 module.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
